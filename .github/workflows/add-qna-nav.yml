name: Add QNA navigation

on:
  push:
    paths:
      - '.github/workflows/add-qna-nav.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add site navigation to Greece QNA legacy page
        shell: python
        run: |
          from pathlib import Path
          p = Path('quarterly-national-accounts/greece/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<body>'
          nav = '''<body>\n<div style="position:sticky;top:0;z-index:9999;background:#0b2742;color:#fff;padding:10px 16px;font-family:Arial,sans-serif;font-size:14px;border-bottom:1px solid rgba(255,255,255,.15)">\n  <a href="https://aclusterresearch.com/" style="color:#fff;text-decoration:none;font-weight:700;margin-right:18px">Home</a>\n  <a href="https://aclusterresearch.com/macro/" style="color:#fff;text-decoration:none;font-weight:700;margin-right:18px">Macro</a>\n  <a href="https://aclusterresearch.com/macro/europe/" style="color:#fff;text-decoration:none;font-weight:700">Europe</a>\n</div>'''
          if 'https://aclusterresearch.com/macro/europe/' in s:
              raise SystemExit('Navigation already present')
          if marker not in s:
              raise SystemExit('Body tag not found')
          p.write_text(s.replace(marker, nav, 1), encoding='utf-8')

      - name: Commit navigation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "A-CLUSTER Site Maintenance"
          git config user.email "97484143+vassilisKavvalos@users.noreply.github.com"
          git add quarterly-national-accounts/greece/index.html
          git commit -m "Add Home Macro Europe navigation to Greece QNA"
          git push origin HEAD:main
